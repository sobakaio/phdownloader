<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { width: 320px; margin: 0; background: #14141a; color: #e8e8ee; font: 13px system-ui, sans-serif; }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 14px; margin: 0; }
  .status { color: #8a8a96; line-height: 1.5; min-height: 2em; }
  button { cursor: pointer; border: none; border-radius: 7px; padding: 8px; font-size: 13px; background: #2a2a33; color: #e8e8ee; }
  button.primary { background: rgb(255, 153, 0); color: #101010; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .48; cursor: default; }
  .row { display: flex; gap: 8px; }
</style></head>
<body>
  <div class="wrap">
    <h1>PHDownloader</h1>
    <div id="status" class="status">Checking current tab…</div>
    <div class="row">
      <button id="toggle" class="primary">Toggle panel on page</button>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
